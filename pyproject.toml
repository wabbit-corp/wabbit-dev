[tool.poetry]
name = "wabbit-dev"
version = "1.1.0"
description = "Development utilities for the Wabbit project"
authors = ["Sir Wabbit"]
license = "AGPL"
readme = "README.md"
packages = [{ include = "dev" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
beautifulsoup4 = ">=4.12.3,<5.0.0"
aiohttp = ">=3.11.11,<4.0.0"
requests = ">=2.32.3,<3.0.0"
crossrefapi = ">=1.6.0,<2.0.0"
arxiv = ">=2.1.3,<3.0.0"
semanticscholar = ">=0.9.0,<2.0.0"
jinja2 = ">=3.1.5,<4.0.0"
pathspec = ">=0.12.1,<2.0.0"
pygithub = ">=2.5.0,<3.0.0"
gitpython = ">=3.1.44,<4.0.0"
gitdb = ">=4.0.12,<5.0.0"
graphviz = ">=0.20.3,<1.0.0"
httpx = ">=0.28.1,<1.0.0"
packaging = ">=25.0,<26.0"
pillow = ">=12.1.1,<13.0.0"
pyperclip = ">=1.11.0,<2.0.0"
pyyaml = ">=6.0.3,<7.0.0"
dateparser = ">=1.2.2,<2.0.0"
termcolor = ">=3.2.0,<4.0.0"
openai = ">=1.60.0,<2.0.0"
defusedxml = ">=0.7.1,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.2,<9.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
coverage = ">=7.10.7,<8.0.0"
pyinstaller = ">=6.9.0,<7.0.0"

[tool.poetry.scripts]
wabbit-dev = "dev.cli:main"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["B"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.deptry.package_module_name_map]
pygithub = "github"
pyyaml = "yaml"
pillow = "PIL"
pyinstaller = "PyInstaller"

[tool.deptry]
per_rule_ignores = { "DEP002" = ["defusedxml"], "DEP003" = ["mu"] }

[tool.coverage.run]
branch = true
source = ["dev"]
omit = ["**/__pycache__/*", ".venv/*", "test/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
precision = 0

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

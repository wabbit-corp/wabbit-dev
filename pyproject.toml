[tool.poetry]
name = "wabbit-dev"
version = "1.1.0"
description = "Development utilities for the Wabbit project"
authors = ["Sir Wabbit"]
license = "AGPL"
readme = "README.md"
homepage = "https://github.com/wabbit-corp/wabbit-dev"
repository = "https://github.com/wabbit-corp/wabbit-dev"

classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3"]
packages = [{ include = "dev" }]

[tool.poetry.urls]
"Issue Tracker" = "https://github.com/wabbit-corp/wabbit-dev/issues"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
beautifulsoup4 = ">=4.12.3,<5.0.0"
aiohttp = ">=3.11.11,<4.0.0"
aiodns = ">=3.2.0,<4.0.0"
requests = ">=2.32.3,<3.0.0"
dateparser = ">=1.2.2,<2.0.0"
defusedxml = ">=0.7.1,<1.0.0"
jinja2 = ">=3.1.5,<4.0.0"
gitdb = ">=4.0.12,<5.0.0"
gitpython = ">=3.1.44,<4.0.0"
graphviz = ">=0.20.3,<1.0.0"
packaging = ">=25.0,<26.0"
pathspec = ">=0.12.1,<2.0.0"
pillow = ">=12.1.1,<13.0.0"
pygithub = ">=2.5.0,<3.0.0"
pyperclip = ">=1.11.0,<2.0.0"
termcolor = ">=3.2.0,<4.0.0"
anthropic = ">=0.44.0,<2.0.0"
openai = ">=1.60.0,<2.0.0"
fastembed = ">=0.7.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.2,<9.0.0"
mypy = ">=1.10.0,<2.0.0"
ruff = ">=0.8.0,<1.0.0"
black = ">=24.0.0,<26.0.0"
coverage = ">=7.0.0,<8.0.0"
build = ">=1.2.0,<2.0.0"
twine = ">=5.0.0,<6.0.0"
pyinstaller = ">=6.9.0,<7.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.6,<9.7"
codespell = ">=2.3,<3.0"

[tool.poetry.scripts]
wabbit-dev = "dev.cli:main"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
pretty = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry.package_module_name_map]
"beautifulsoup4" = "bs4"
"gitpython" = "git"
"pillow" = "PIL"
"pygithub" = "github"
"pyinstaller" = "PyInstaller"
"pytest-asyncio" = "asyncio"

[tool.deptry]
per_rule_ignores = { "DEP004" = ["pytest", "mypy", "ruff", "black", "coverage", "build", "twine", "codespell", "mkdocs", "mkdocs-material", "pyinstaller", "PyInstaller"] }

[tool.coverage.run]
branch = true
source = ["dev"]
omit = ["**/__pycache__/*", ".venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
precision = 0

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

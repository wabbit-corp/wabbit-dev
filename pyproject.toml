[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.6,<9.7"
codespell = ">=2.3,<3.0"

[tool.poetry.scripts]
wabbit-dev = "dev.cli:main"
dev = "dev.cli:main"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
pretty = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry.package_module_name_map]
"gitpython" = "git"
"lang-mu" = "mu"
"pillow" = "PIL"
"pygithub" = "github"
"pyinstaller" = "PyInstaller"
"pytest-asyncio" = "asyncio"

[tool.deptry]
per_rule_ignores = { "DEP004" = ["pytest", "mypy", "ruff", "black", "coverage", "build", "twine", "codespell", "mkdocs", "mkdocs-material", "pyinstaller", "PyInstaller"] }

[tool.coverage.run]
branch = true
source = ["dev"]
omit = ["**/__pycache__/*", ".venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
precision = 0

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
